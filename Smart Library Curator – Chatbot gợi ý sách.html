.pane{flex:1;min-height:0;display:flex;flex-direction:column}
#quizv{overflow-y:auto;padding:12px 14px}
.q{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.q h3{font-size:15px;margin:0 0 8px}.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{font:inherit;font-size:13.5px;padding:8px 12px;border-radius:99px;border:1.5px solid var(--bd);background:var(--bg2);color:var(--ink);cursor:pointer}
.opt.on{background:var(--p1);border-color:var(--p1);color:#fff;font-weight:700}

.acts{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}.acts .chip{font-weight:700}
.ai{white-space:pre-wrap}.src{font-size:11px;color:var(--mut);margin-top:6px;white-space:normal}
#fav{width:100%;border-radius:14px}

const STOP=new Set("la va cho toi minh em thich muon doc sach nhung cac co khong mot nao nhe goi y ve nhu cuon hay can tim duoc cua voi rat giong me hoc".split(" "));
const N=s=>s.toLowerCase().replace(/đ/g,"d").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const words=s=>N(s).split(" ").filter(w=>w.length>1&&!STOP.has(w));
const grams=s=>{const t=words(s),g=[...t];for(let i=0;i<t.length-1;i++)g.push(t[i]+"_"+t[i+1]);return g};
const cos=(a,b)=>{let d=0,x=0,y=0;for(const k in a){x+=a[k]*a[k];if(b[k])d+=a[k]*b[k]}for(const k in b)y+=b[k]*b[k];return x&&y?d/Math.sqrt(x*y):0};
const mk=txt=>{const docs=B.map(txt),df={};docs.forEach(d=>new Set(d).forEach(w=>df[w]=(df[w]||0)+1));const idf=w=>Math.log((B.length+1)/(df[w]+1))+1;
  const vec=g=>{const v={};g.forEach(w=>{if(df[w])v[w]=(v[w]||0)+idf(w)});return v};return{vec,dv:docs.map(vec)}};
const VER={B:mk(b=>grams([b.g,b.k,b.k,b.t,b.a].join(" ")))};
let cur="B",vec=VER.B.vec,dv=VER.B.dv;
const alias=t=>{const m=t.match(/^(.*?)\s*\((.*)\)\s*$/);return (m?[m[1],m[2]]:[t]).flatMap(x=>[x,x.split(":")[0]])};
const mature=b=>MATURE.test(b.t);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);

function recommend(text){
  const nq=" "+N(text)+" ";
  if(/ ngau nhien /.test(nq)){
    const seen=new Set(),pick=[];
    shuffle(B.keys()).forEach(i=>{if(pick.length<3&&!seen.has(B[i].g)&&!mature(B[i])){seen.add(B[i].g);pick.push({i,why:"Chọn ngẫu nhiên từ nhóm “"+B[i].g+"” để bạn thử cái mới."})}});
    return{intro:"Đây là 3 cuốn ngẫu nhiên, mỗi cuốn một nhóm khác nhau:",top:pick};
  }
  const liked=B.findIndex(b=>alias(b.t).some(x=>{const n=N(x);return n.length>=9?nq.includes(" "+n+" "):n.length>=4&&(nq.includes(" giong "+n+" ")||nq.includes(" nhu "+n+" "))}));
  const qv=vec(grams(text)),qw=new Set(words(text));
  if(liked>=0){const lv=dv[liked];for(const k in lv)qv[k]=(qv[k]||0)+lv[k];words(B[liked].k).forEach(w=>qw.add(w))}
  const sc=dv.map((v,i)=>({i,s:i===liked?-1:cos(qv,v)})).sort((a,b)=>b.s-a.s);
  const why=i=>{const m=B[i].k.split(", ").filter(k=>words(k).some(w=>qw.has(w)));
    return m.length?"Vì trùng nội dung: "+m.join("; ")+".":"Cùng nhóm hoặc tác giả với điều bạn mô tả."};
  if(sc[0].s<=0.01)return{intro:"Mình chưa bắt được sở thích của bạn. Thử nêu thể loại, chủ đề hoặc “giống” một cuốn bạn từng thích, hoặc gõ “ngẫu nhiên”.",top:[]};
  const top=sc.filter(x=>x.s>0.01).slice(0,4).map(x=>({i:x.i,why:why(x.i)}));
  const used=new Set(top.map(t=>B[t.i].g));
  const cand=sc.filter(x=>x.s>=0&&!used.has(B[x.i].g)&&!mature(B[x.i]));
  const ex=cand.find(x=>x.s>0.01)||shuffle(cand)[0];
  return{intro:liked>=0?"Vì bạn thích “"+B[liked].t+"”, mình gợi ý:":"Dựa trên sở thích bạn vừa nói, mình gợi ý:",top,
    explore:ex&&{i:ex.i,why:"Khác nhóm với các cuốn trên để bạn thoát khỏi “bong bóng lọc”. "+(ex.s>0.01?why(ex.i):"Hãy thử như một lựa chọn bất ngờ.")}};
}

  const w=el("div","why");if(isNew)w.appendChild(el("span","badge","✨ Khám phá"));if(mature(b))w.appendChild(el("span","badge w","🔞 Nên hỏi thủ thư hoặc thầy cô"));w.append(p.why);c.appendChild(w);
  const s=el("div","stars");s.appendChild(el("span","","Hợp với bạn?"));

function track(r,text,ms){const all=[...r.top,...(r.explore?[r.explore]:[])],row={q:text,v:cur,ms,r:{},d:0};

/* ===== CHAT VỚI AI (Claude) ===== */
const SYS="Bạn là Smart Library Curator, thủ thư AI thân thiện cho học sinh lớp 10. Chỉ gợi ý sách có trong KHO SÁCH bên dưới và ghi đúng tên sách. Mỗi lần gợi ý: 3–4 cuốn kèm lý do một câu dựa trên nhãn nội dung, cộng 1 cuốn “Khám phá” khác nhóm với các cuốn còn lại để tránh bong bóng lọc. Nếu thiếu thông tin thì hỏi lại tối đa 1 câu. Sách đánh dấu [NL] có nội dung người lớn: nhắc học sinh nên hỏi thủ thư hoặc thầy cô. Không hỏi hay lưu thông tin cá nhân. Không bịa nội dung sách ngoài các nhãn; nếu không chắc hãy nói rõ. Cuối câu trả lời nhắc ngắn rằng học sinh là người quyết định. Trả lời bằng tiếng Việt, dưới 160 từ, văn bản thuần không dùng markdown, dùng dấu • đầu dòng. Nếu học sinh nêu một bộ phim hoặc sách ngoài kho, hãy nói ngắn bạn hiểu tác phẩm đó nói về điều gì (nếu không chắc thì nói rõ), rồi gợi ý sách trong kho có chủ đề tương tự. Nếu học sinh nói ngoài chủ đề sách thì nhẹ nhàng đưa về sách.";
const CAT=B.map(b=>"- "+b.t+" – "+b.a+" ["+b.g+"]"+(mature(b)?" [NL]":"")+": "+b.k).join("\n");
const hist=[];let SM,busy=false,aiOff=false;
async function getSample(){if(SM!==undefined)return SM;try{SM=window.claude?await claude.use("sample"):null}catch(e){SM=null}return SM}
async function send(text){
  if(busy)return;busy=true;q.disabled=true;let w;
  add("me",d=>d.textContent=text);
  const fallback=msg=>{aiOff=true;add("bot",d=>d.textContent=msg);localReply(text)};
  try{
    const sm=aiOff?null:await getSample();
    if(!sm){if(!aiOff)fallback("Chưa dùng được AI ở lần mở trang này, nên mình dùng bộ máy gợi ý có sẵn nhé.");else localReply(text);return}
    const hint=recommend(text).top.map(p=>B[p.i].t).join("; ");
    const prompt=SYS+"\n\nKHO SÁCH:\n"+CAT+"\n\nGợi ý ban đầu từ bộ máy gợi ý (chỉ để tham khảo, bạn có thể đồng ý hoặc đổi): "+(hint||"(không có)")+"\n\nHội thoại trước:\n"+hist.slice(-8).map(h=>(h.r==="u"?"Học sinh: ":"Curator: ")+h.t).join("\n")+"\n\nHọc sinh: "+text+"\nCurator:";
    let bub;w=add("bot",d=>{bub=d;d.classList.add("ai");d.innerHTML='<span class="dots"><i></i><i></i><i></i></span>'});
    const res=await sm(prompt,{cache:false,modelTier:"quick",onText:({text:t})=>{bub.textContent=t;log.scrollTop=log.scrollHeight}});
    bub.textContent=res.text;bub.appendChild(el("div","src","🤖 Trả lời bởi AI, chỉ gợi ý trong kho "+B.length+" sách. Hãy tự kiểm tra trước khi tin."));
    hist.push({r:"u",t:text},{r:"c",t:res.text});
  }catch(e){if(w)w.remove();
    if(e&&e.code==="not_granted")fallback("Bạn chưa cho phép dùng AI, nên mình dùng bộ máy gợi ý có sẵn nhé.");
    else if(e&&e.code==="rate_limited")add("bot",d=>d.textContent="AI đang bận, bạn thử lại sau ít phút nhé.");
    else fallback("AI chưa trả lời được lúc này, mình dùng bộ máy gợi ý có sẵn thay nhé.")}
  finally{busy=false;q.disabled=false;q.focus()}
}

  {const fc=el("div","q"),fi=el("input");fc.appendChild(el("h3","","⭐ Cuốn sách hoặc bộ phim bạn mê nhất? (không bắt buộc)"));

  Q.forEach((qq,qi)=>{const c=el("div","q"),o=el("div","opts");c.appendChild(el("h3","",(qi+1)+". "+qq.q+(qq.m?" (chọn nhiều)":"")));

  {const fr=el("div","q"),ta=el("textarea"),ex=el("div","exs");fr.appendChild(el("h3","","✍️ Muốn nói rõ hơn? Viết thêm bằng lời của bạn (không bắt buộc)"));
    ta.id="free";ta.rows=3;ta.maxLength=200;ta.placeholder="Ví dụ: mình thích truyện bí ẩn, nhiều tình tiết bất ngờ…";
    ["Mình thích truyện bí ẩn, nhiều bất ngờ","Mình muốn hiểu hơn về tuổi trẻ và tình bạn","Mình tò mò về tương lai của công nghệ"].forEach(t=>{const b=el("button","chip",t);b.type="button";b.onclick=()=>{ta.value=t};ex.appendChild(b)});
    fr.append(ta,ex);quizv.appendChild(fr)}
  const go=el("button","go big","✨ Xem gợi ý cho mình"),rs=el("button","chip","↺ Làm lại"),br=el("div","btnrow");go.type=rs.type="button";go.onclick=quizResult;rs.onclick=renderQuiz;br.append(go,rs);

let qbusy=false;
async function quizResult(){if(qbusy)return;const res=document.getElementById("qres");res.textContent="";
  const pk=Q.map((qq,qi)=>[...sel[qi]].map(oi=>qq.o[oi])),fav=document.getElementById("fav").value.trim(),free=document.getElementById("free").value.trim();
  if(!fav&&!free&&!pk.slice(0,4).some(a=>a.length)){res.appendChild(el("p","hint","Hãy chọn vài ô, nhập 1 sách/phim hoặc viết vài chữ về gu của bạn nhé!"));return}
  qbusy=true;res.appendChild(el("p","hint","⏳ Đang tìm sách hợp với bạn…"));
  try{
  let kw=pk.slice(0,4).flatMap((a,qi)=>a.flatMap(x=>qi===1?[x[1],x[1]]:[x[1]])).join(" "),note="",favKw="";
  if(free)kw+=" "+free;
  if(fav){kw+=" giong "+fav;
    if(recommend(kw).intro.startsWith("Vì bạn thích"))note="📖 Mình thấy “"+fav+"” có trong kho nên so trực tiếp nội dung với các sách khác.";
    else{const sm=aiOff?null:await getSample();
      if(!sm)note="AI chưa dùng được nên mình chưa đọc được nội dung “"+fav+"”, gợi ý chủ yếu theo các lựa chọn của bạn.";
      else try{const PR="Học sinh lớp 10 nói rằng mình mê tác phẩm: “"+fav+"” (có thể là sách hoặc phim). Hãy xác định đó là tác phẩm nào, rồi rút 6–10 từ khóa chủ đề hoặc thể loại ngắn gọn bằng tiếng Việt phản ánh đúng nội dung (ví dụ: trinh thám, phiêu lưu, tình cảm, khoa học viễn tưởng, vũ trụ, tuổi thơ, gia đình, tâm lý, lịch sử, triết lý, nghị lực, công nghệ). Nếu không chắc đó là tác phẩm nào thì đặt known=false và kw rỗng. Chỉ trả về JSON dạng {\"known\":true,\"what\":\"tên và loại (sách hoặc phim)\",\"kw\":[\"...\"]}.";
        const j=sm.json?await sm.json(PR,{modelTier:"quick"}):JSON.parse((await sm(PR)).text.match(/\{[\s\S]*\}/)[0]);
        if(j&&j.known&&Array.isArray(j.kw)&&j.kw.length){const k=j.kw.slice(0,10).map(String);favKw=k.join(" ");note="🎬 Mình hiểu bạn thích “"+String(j.what||fav).slice(0,80)+"”, với các chủ đề: "+k.join(", ")+". Nếu mình hiểu sai, hãy sửa lại tên rồi bấm lại nhé."}
        else note="Mình chưa nhận ra “"+fav+"”, nên gợi ý chủ yếu theo các lựa chọn của bạn."}
      catch(e){if(e&&e.code==="not_granted")aiOff=true;note="Mình chưa đọc được nội dung “"+fav+"” lần này, nên gợi ý theo các lựa chọn của bạn."}}}
  const q2=kw+(favKw?" "+favKw+" "+favKw:""),t0=performance.now(),r=recommend(q2),row=track(r,fav?"Trắc nghiệm + "+fav:"Trắc nghiệm",performance.now()-t0),
    wantNew=!pk[4].length||pk[4][0][1]==="yes";

  res.appendChild(el("h3","",fav?"🎯 Sách tương tự “"+fav+"” và hợp gu bạn":"🎯 Gợi ý cho bạn"));r.top.forEach(p=>res.appendChild(card(p,false,row)));
  if(wantNew&&r.explore)res.appendChild(card(r.explore,true,row));
  const acts=el("div","acts"),a=el("button","chip","💬 Hỏi AI giải thích thêm"),b=el("button","chip","↺ Làm lại");a.type=b.type="button";

  b.onclick=renderQuiz;acts.append(a,b);res.appendChild(acts);res.scrollIntoView({behavior:"smooth",block:"nearest"})
  }finally{qbusy=false}}
